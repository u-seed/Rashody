<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Семейные финансы</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💰</text></svg>">
<style>
:root{--bg:#f3f4f8;--card:#fff;--ink:#0f172a;--mut:#6b7280;--line:#eceef3;--acc:#4f46e5;--accs:#eef2ff;--in:#059669;--ins:#d1fae5;--out:#e11d48;--outs:#ffe4e6;--warn:#d97706;--warns:#fef3c7;--chip:#eceef4;--shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px rgba(15,23,42,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0a0e1c;--card:#131a2e;--ink:#eef1f8;--mut:#93a0bd;--line:#222b46;--acc:#818cf8;--accs:#1e2547;--in:#34d399;--ins:#0f3d31;--out:#fb7185;--outs:#4a1626;--warn:#fbbf24;--warns:#43310d;--chip:#1b2340;--shadow:none}}
:root[data-theme=dark]{--bg:#0a0e1c;--card:#131a2e;--ink:#eef1f8;--mut:#93a0bd;--line:#222b46;--acc:#818cf8;--accs:#1e2547;--in:#34d399;--ins:#0f3d31;--out:#fb7185;--outs:#4a1626;--warn:#fbbf24;--warns:#43310d;--chip:#1b2340;--shadow:none}
*{box-sizing:border-box}html,body{max-width:100%;overflow-x:hidden}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:1080px;margin:0 auto;padding:16px 14px 60px}
h1{font-size:22px;margin:0;letter-spacing:-.3px}
h2{font-size:18px;margin:0;letter-spacing:-.2px}
.hd{margin-bottom:14px}.hd p{margin:2px 0 0;color:var(--mut);font-size:13px}
.mut{color:var(--mut)}.small{font-size:13px}
.card{background:var(--card);border-radius:20px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:0;background:var(--chip);color:var(--ink);padding:9px 14px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--acc);color:#fff;font-weight:600}
.chip.sm{padding:5px 10px;font-size:12px}
select,input[type=search],input[type=password],input[type=text]{font:inherit;font-size:15px;background:var(--chip);color:var(--ink);border:1px solid transparent;border-radius:12px;padding:9px 12px;max-width:100%}
.sticky{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0 8px;margin:0 -2px}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}.tabs::-webkit-scrollbar{display:none}
.tab{flex:none}
.hero{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:720px){.hero{grid-template-columns:1.2fr 1fr 1fr}}
.big{font-size:30px;font-weight:800;letter-spacing:-1px;white-space:nowrap}
.lbl{font-size:13px;color:var(--mut);margin-bottom:2px}
.in{color:var(--in)}.out{color:var(--out)}
.split{height:10px;border-radius:6px;background:var(--out);overflow:hidden;margin-top:12px}.split i{display:block;height:100%;background:var(--in)}
.banner{display:flex;gap:12px;align-items:center;background:var(--warns);color:var(--ink);border-radius:16px;padding:12px 14px;margin-bottom:16px;cursor:pointer}
.banner b{color:var(--warn)}
.grid2{display:grid;grid-template-columns:1fr;gap:16px}@media(min-width:900px){.grid2{grid-template-columns:1fr 1fr}}
.grid2>*{min-width:0}.grid2 .card{margin-bottom:0}
.dn{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:center}
.dn svg{flex:none}.dn .lst{flex:1;min-width:230px}
.lrow{display:flex;align-items:center;gap:10px;padding:9px 6px;border-radius:12px;cursor:pointer}
.lrow:hover,.lrow:active{background:var(--chip)}
.lrow .dot{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:18px;flex:none}
.lrow .mid{flex:1;min-width:0}.lrow .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .bar{height:6px;border-radius:4px;background:var(--chip);margin-top:5px;overflow:hidden}.lrow .bar i{display:block;height:100%;border-radius:4px}
.lrow .rt{text-align:right;white-space:nowrap}.lrow .rt b{display:block}.lrow .rt span{font-size:12px;color:var(--mut)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:500;font-size:12px}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
td.tl{text-align:left;white-space:normal}
.heat{display:block;padding:4px 8px;border-radius:8px;cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;margin-top:10px;color:var(--mut)}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.ins{display:grid;gap:10px;margin-top:12px}.ins div{background:var(--accs);border-radius:14px;padding:12px 14px}
.mon{display:grid;grid-template-columns:70px 1fr auto;gap:4px 12px;align-items:center;padding:12px 6px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:12px}
.mon:hover{background:var(--chip)}.mon .m{font-weight:700}
.mon .b{height:8px;border-radius:5px;background:var(--chip);overflow:hidden}.mon .b i{display:block;height:100%;background:var(--out);border-radius:5px}
.mon .v{text-align:right;white-space:nowrap}.mon .why{grid-column:2/4;font-size:13px;color:var(--mut)}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--warns);color:var(--warn);margin-left:6px;vertical-align:middle}
.badge.g{background:var(--chip);color:var(--mut)}
.modal{position:fixed;inset:0;background:rgba(2,6,23,.6);display:none;align-items:flex-end;justify-content:center;z-index:20;backdrop-filter:blur(2px)}
.modal.on{display:flex}#ed{z-index:30}
.sheet{background:var(--bg);width:100%;max-width:780px;max-height:93vh;overflow:auto;border-radius:24px 24px 0 0;padding:16px;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
@media(min-width:900px){.modal{align-items:center}.sheet{border-radius:24px;max-height:90vh}}
.sheet .card{box-shadow:none;border:1px solid var(--line)}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px}
.kp div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.kp b{display:block;font-size:19px;white-space:nowrap}
.tx{display:grid;grid-template-columns:48px 1fr auto;gap:2px 10px;padding:10px 4px;border-bottom:1px solid var(--line);align-items:center;cursor:pointer;border-radius:10px}
.tx:hover{background:var(--chip)}.tx .d{font-size:12px;color:var(--mut)}.tx .nm{overflow:hidden;text-overflow:ellipsis}.tx .a{font-weight:700;white-space:nowrap}.tx .c{font-size:12px;color:var(--mut);grid-column:2/4}
.why-box{background:var(--warns);border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:14px}
.why-box li{margin:3px 0}
#lock{max-width:380px;margin:14vh auto;text-align:center}
#lock input{width:100%;margin:10px 0}
button.main{background:var(--acc);color:#fff;border:0;border-radius:14px;padding:12px 16px;font:inherit;font-weight:700;width:100%;cursor:pointer}
button.sec{background:var(--chip);color:var(--ink);border:0;border-radius:14px;padding:12px 16px;font:inherit;font-weight:600;cursor:pointer}
.err{color:var(--out);min-height:20px;font-size:13px}
.note{font-size:13px;color:var(--mut);margin:6px 4px}
.rev{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:12px 4px;border-bottom:1px solid var(--line)}
.rev .why{grid-column:1/3;font-size:12px;color:var(--warn)}.rev .btns{grid-column:1/3;display:flex;gap:6px}
label.f{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
</style>
</head>
<body>
<div class="wrap">
 <div id="lock" class="card" style="display:none">
  <div style="font-size:44px">🔒</div><h2>Семейные финансы</h2>
  <div class="mut small">Данные зашифрованы. Введите пароль.</div>
  <input id="pw" type="password" placeholder="Пароль" autocomplete="current-password">
  <label class="small mut"><input type="checkbox" id="rem" checked> запомнить на этом устройстве</label>
  <div class="err" id="err"></div>
  <button class="main" id="go">Открыть</button>
 </div>
 <div id="app" style="display:none">
  <div class="top"><div class="hd"><h1>💰 Семейные финансы</h1><p id="sub"></p></div><button class="chip" id="theme">🌓</button></div>
  <div class="card" style="padding:14px">
   <div class="row" id="periodChips"></div>
   <div class="row" style="margin-top:10px"><select id="from"></select><span class="mut">→</span><select id="to"></select><select id="who"></select>
    <button class="chip" id="lifeBtn">Без переводов и кредитов</button></div>
  </div>
  <div class="sticky"><div class="tabs" id="tabs"></div></div>
  <div id="view" style="margin-top:8px"></div>
  <div class="note" id="foot"></div>
 </div>
</div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="modal" id="ed"><div class="sheet" id="edsheet"></div></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const MN = ["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"];
const MF = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
const fmt = n => Math.round(n).toLocaleString("ru-RU").replace(/\u00a0/g," ");
const short = n => { const a=Math.abs(n); return a>=1e6 ? (n/1e6).toFixed(a>=1e7?0:1).replace(".",",")+" млн" : a>=1e3 ? Math.round(n/1e3)+" тыс" : Math.round(n)+""; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mLabel = m => MN[+m.slice(5)-1] + " " + m.slice(2,4);
const mFull = m => MF[+m.slice(5)-1] + " " + m.slice(0,4);
const J = o => esc(JSON.stringify(o));
let D, INT, LOAN, MONEY, INCC;
let ST = {from:"", to:"", who:"all", life:false, tab:"over", search:"", cat:"", dir:"all", page:1};
let STACK = [];
let OV = {tx:{}, merchant:{}};
try { OV = JSON.parse(localStorage.getItem("ff_ov") || "") || OV; } catch(e){}
const saveOV = () => { try { localStorage.setItem("ff_ov", JSON.stringify(OV)); } catch(e){} };
const tkey = t => `${t.d}|${+t.amt.toFixed(2)}|${t.m}|${t.a}`;
const clsFor = (cat, dir) => INT.has(cat) ? "internal" : LOAN.has(cat) ? "loan_in" : dir==="in" ? "income" : "expense";

/* ───── загрузка ───── */
async function decrypt(blob, pw){
  const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2",salt:b(blob.salt),iterations:blob.iter,hash:"SHA-256"}, km, {name:"AES-GCM",length:256}, false, ["decrypt"]);
  const buf = await crypto.subtle.decrypt({name:"AES-GCM",iv:b(blob.iv)}, key, b(blob.ct));
  return JSON.parse(await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"))).text());
}
async function boot(){
  let blob=null, plain=null;
  try { const r = await fetch("data.enc.json",{cache:"no-store"}); if(r.ok) blob = await r.json(); } catch(e){}
  if(!blob){ try { const r = await fetch("data.json",{cache:"no-store"}); if(r.ok) plain = await r.json(); } catch(e){} }
  if(plain){ start(plain); return; }
  $("#lock").style.display="block";
  if(!blob){ $("#lock").innerHTML="<h2>Нет данных</h2><div class='mut'>Загрузите docs/data.enc.json</div>"; return; }
  const attempt = async pw => { try { start(await decrypt(blob, pw)); if($("#rem").checked) localStorage.setItem("ff_pw", pw); return true; } catch(e){ console.error(e); return false; } };
  const saved = localStorage.getItem("ff_pw"); if(saved && await attempt(saved)) return;
  const go = async () => { $("#err").textContent=""; $("#go").textContent="Расшифровываю…"; const ok = await attempt($("#pw").value); $("#go").textContent="Открыть"; if(!ok) $("#err").textContent="Неверный пароль"; };
  $("#go").onclick = go; $("#pw").onkeydown = e => { if(e.key==="Enter") go(); };
}

/* ───── старт ───── */
function start(data){
  D = data; $("#lock").style.display="none"; $("#app").style.display="block";
  INT = new Set(D.kinds.internal); LOAN = new Set(D.kinds.loan); INCC = D.kinds.income; MONEY = new Set(D.groups.money);
  D.tx.forEach((t,i) => { t.id = i; t.bc = t.cat; t.bl = t.cls; });
  applyOV();
  D.months = [...new Set(D.tx.map(t => t.d.slice(0,7)))].sort();
  const last = D.months[D.months.length-1];
  ST.to = last; ST.from = D.months[Math.max(0, D.months.length-12)];
  const opts = D.months.map(m => `<option value="${m}">${mFull(m)}</option>`).join("");
  $("#from").innerHTML = opts; $("#to").innerHTML = opts;
  $("#who").innerHTML = `<option value="all">Вся семья</option>` + D.people.map(p => `<option>${esc(p)}</option>`).join("");
  $("#periodChips").innerHTML = [["3 мес",3],["6 мес",6],["12 мес",12],["Всё время",999]].map(([l,n]) => `<button class="chip" data-n="${n}">${l}</button>`).join("");
  $("#periodChips").onclick = e => { const n = e.target.dataset.n; if(!n) return; ST.to = last; ST.from = D.months[Math.max(0, D.months.length-n)]; sync(); render(); };
  $("#from").onchange = e => { ST.from = e.target.value; if(ST.from>ST.to) ST.to=ST.from; sync(); render(); };
  $("#to").onchange = e => { ST.to = e.target.value; if(ST.from>ST.to) ST.from=ST.to; sync(); render(); };
  $("#who").onchange = e => { ST.who = e.target.value; render(); };
  $("#lifeBtn").onclick = () => { ST.life = !ST.life; render(); };
  $("#tabs").onclick = e => { const k = e.target.dataset.k; if(k){ ST.tab = k; ST.page=1; render(); window.scrollTo({top:0}); } };
  $("#theme").onclick = () => { const r = document.documentElement; const dark = getComputedStyle(r).getPropertyValue("--bg").trim()==="#0a0e1c"; r.dataset.theme = dark ? "light" : "dark"; render(); };
  $("#modal").onclick = e => { if(e.target.id==="modal") closeDrill(); };
  $("#ed").onclick = e => { if(e.target.id==="ed") $("#ed").classList.remove("on"); };
  document.addEventListener("click", e => {
    const a = e.target.closest("[data-d]"); if(a && !e.target.closest("#ed")){ drill(JSON.parse(a.dataset.d)); return; }
    const b = e.target.closest("[data-e]"); if(b){ openEdit(D.tx[+b.dataset.e]); }
  });
  $("#sub").textContent = `данные: ${D.tx[0].d.split("-").reverse().join(".")} — ${D.tx[D.tx.length-1].d.split("-").reverse().join(".")} · обновлено ${D.generated}`;
  sync(); render();
}
const sync = () => { $("#from").value = ST.from; $("#to").value = ST.to; };
function applyOV(){
  D.tx.forEach(t => {
    t.cat = t.bc; t.cls = t.bl; t.lov = 0;
    const n = OV.tx[tkey(t)] || OV.merchant[t.m+"|"+t.dir];
    if(n){ t.cat = n; t.cls = clsFor(n, t.dir); t.lov = 1; }
  });
}

/* ───── вычисления ───── */
const monthsIn = (f,t) => D.months.filter(m => m>=f && m<=t);
const isLifeExp = t => !MONEY.has(t.cat);
function view(){
  const ms = monthsIn(ST.from, ST.to), set = new Set(ms);
  const tx = D.tx.filter(t => set.has(t.d.slice(0,7)) && (ST.who==="all" || t.p===ST.who));
  const inc = tx.filter(t => t.cls==="income");
  let exp = tx.filter(t => t.cls==="expense");
  if(ST.life) exp = exp.filter(isLifeExp);
  return {ms, tx, inc, exp, internal: tx.filter(t => t.cls==="internal"), loan: tx.filter(t => t.cls==="loan_in")};
}
const sum = a => a.reduce((s,t) => s+t.amt, 0);
function by(arr, f){ const m = new Map(); for(const t of arr){ const k = f(t); m.set(k, (m.get(k)||0)+t.amt); } return m; }
const sortDesc = m => [...m.entries()].sort((a,b) => b[1]-a[1]);
const hash = s => { let h=0; for(const c of s) h=(h*31+c.charCodeAt(0))>>>0; return h; };
const style = c => D.categories[c] || {c:`hsl(${hash(c)%360} 55% 55%)`, i:"🏷️"};
const hexA = (h,a) => { if(h[0]!=="#") return h; const n = parseInt(h.slice(1),16); return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`; };
const median = a => { const s=[...a].sort((x,y)=>x-y), n=s.length; return n? (n%2? s[(n-1)/2] : (s[n/2-1]+s[n/2])/2) : 0; };
function anomalies(V){
  const E = by(V.exp, t => t.d.slice(0,7)), vals = V.ms.map(m => E.get(m)||0), med = median(vals), out = new Map();
  if(V.ms.length >= 4) V.ms.forEach(m => { const v = E.get(m)||0; if(v > med*1.5 && v-med > 100000) out.set(m, {v, med, pct: Math.round((v/med-1)*100)}); });
  return {out, med, E};
}

/* ───── графики ───── */
function donut(items, total, label){
  const R=62, C=2*Math.PI*R; let off=0, g="";
  items.forEach(([name,v,color,d]) => { const len = v/total*C; g += `<circle class="${d?"":""}" ${d?`data-d='${J(d)}' style="cursor:pointer"`:""} r="${R}" cx="90" cy="90" fill="none" stroke="${color}" stroke-width="26" stroke-dasharray="${Math.max(len-1.5,0.5)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 90 90)"><title>${esc(name)}: ${fmt(v)} ₸</title></circle>`; off += len; });
  return `<svg width="180" height="180" viewBox="0 0 180 180">${g}<text x="90" y="86" text-anchor="middle" font-size="22" font-weight="800" fill="var(--ink)">${short(total)}</text><text x="90" y="106" text-anchor="middle" font-size="12" fill="var(--mut)">${label}</text></svg>`;
}
function catRows(arr, cls, limit, V, nomon){
  const m = by(arr, t => t.cat), tot = sum(arr)||1, n = V.ms.length||1, rows = sortDesc(m).slice(0, limit||99), mx = rows[0] ? rows[0][1] : 1;
  return rows.map(([c,v]) => { const s = style(c); return `<div class="lrow" data-d='${J({cat:c,cls,title:c})}'><div class="dot" style="background:${hexA(s.c,.18)}">${s.i}</div><div class="mid"><div class="nm">${esc(c)}</div><div class="bar"><i style="width:${v/mx*100}%;background:${s.c}"></i></div></div><div class="rt"><b>${fmt(v)} ₸</b><span>${(v/tot*100).toFixed(0)}%${nomon?"":" · "+short(v/n)+"/мес"}</span></div></div>`; }).join("") || `<div class="mut">Нет данных за период</div>`;
}
function donutBlock(arr, cls, label, V, limit=8){
  const m = sortDesc(by(arr, t => t.cat)), tot = sum(arr)||1;
  const top = m.slice(0,7), rest = m.slice(7).reduce((s,x)=>s+x[1],0);
  const items = top.map(([c,v]) => [c,v,style(c).c,{cat:c,cls,title:c}]); if(rest>0) items.push(["Остальное",rest,"#94a3b8",null]);
  return `<div class="dn">${donut(items, tot, label)}<div class="lst">${catRows(arr, cls, limit, V)}</div></div>`;
}
function monthBars(V, mode){
  const ms = V.ms, I = by(V.inc, t => t.d.slice(0,7)), E = by(V.exp, t => t.d.slice(0,7)), an = anomalies(V).out;
  const mx = Math.max(1, ...ms.map(m => Math.max(mode==="exp"?0:(I.get(m)||0), E.get(m)||0)));
  const sw = mode==="exp" ? 46 : 54, W = Math.max(320, ms.length*sw+10), H = 200, pad = 24, bh = H-pad-26;
  let g = "";
  ms.forEach((m,i) => { const x = i*sw+8, hi = (I.get(m)||0)/mx*bh, he = (E.get(m)||0)/mx*bh, flag = an.has(m);
    g += `<g data-d='${J({month:m,title:mFull(m)})}' style="cursor:pointer"><rect x="${x-4}" y="0" width="${sw-2}" height="${H}" fill="transparent"/>`;
    if(mode!=="exp") g += `<rect x="${x}" y="${H-pad-hi}" width="17" height="${hi}" rx="4" fill="var(--in)"/>`;
    g += `<rect x="${mode==="exp"?x+4:x+19}" y="${H-pad-he}" width="${mode==="exp"?26:17}" height="${he}" rx="4" fill="${flag?"var(--warn)":"var(--out)"}"/>`;

/* ───── разбор «на проверку» ───── */
function reviewItems(V){
  const out = [];
  V.tx.forEach(t => {
    if(t.lov || t.ov) return;
    let why = null;
    if(t.dir==="in" && t.amt>=500000 && ["Переводы от людей","Прочие поступления","Пополнение с карт/наличными"].includes(t.cat)) why = "Крупный приход — откуда он?";
    else if(t.cat==="Крупные поступления на счёт") why = "Крупная сумма не учтена в доходах (похоже на возврат с депозита) — верно?";
    else if(t.cat==="Переводы людям" && t.cls==="expense" && t.amt>=500000) why = "Крупный перевод — на что он?";
    else if(t.cls==="expense" && t.cat==="Маркетплейс (уточнить)" && t.amt>=20000) why = "Что куплено на маркетплейсе?";
    else if(t.cls==="expense" && t.cat==="Прочие покупки" && t.amt>=30000) why = "Магазин не распознан";
    else if(t.cls==="expense" && !MONEY.has(t.cat) && t.amt>=100000) why = "Крупная покупка — категория верная?";
    if(why) out.push({t, why});
  });
  return out.sort((a,b) => b.t.amt-a.t.amt);
}

  return `<div class="card"><h2>Нужно уточнить</h2><div class="note">Здесь операции, где я мог ошибиться с категорией, — в основном крупные суммы. Нажмите «Верно», если всё правильно, или «Изменить», чтобы выбрать другую категорию (можно сразу для всех операций с таким названием). Ответы запоминаются на этом устройстве; кнопкой внизу их можно скопировать и прислать мне — я внесу их в расчёт навсегда.</div>
   ${show.map(({t,why}) => `<div class="rev"><div><b>${esc(t.m)}</b><div class="small mut">${t.d.split("-").reverse().join(".")} · ${esc(t.p)} · ${style(t.cat).i} ${esc(t.cat)}</div></div><div class="${t.dir==="in"?"in":"out"}" style="font-weight:800;white-space:nowrap">${t.dir==="in"?"+":"−"}${fmt(t.amt)} ₸</div><div class="why">❓ ${esc(why)}</div><div class="btns"><button class="chip sm" data-ok="${t.id}">✓ Верно</button><button class="chip sm" data-e="${t.id}">✎ Изменить</button></div></div>`).join("") || `<div class="mut" style="padding:20px 0">Всё проверено 🎉</div>`}
   ${rv.length>show.length?`<div class="note">Показано ${show.length} из ${rv.length}. Остальные появятся по мере ответов.</div>`:""}
   <div class="row" style="margin-top:14px"><button class="sec" onclick="copyOV()">📋 Скопировать мои ответы (отправить Claude)</button></div></div>`;
}
function txList(a){
  return a.map(t => `<div class="tx" data-e="${t.id}"><div class="d">${t.d.slice(8)}.${t.d.slice(5,7)}<br>${t.d.slice(2,4)}</div><div class="nm">${esc(t.m)}${t.lov?' <span class="badge g">изм.</span>':""}</div><div class="a ${t.dir==="in"?"in":"out"}">${t.dir==="in"?"+":"−"}${fmt(t.amt)} ₸</div><div class="c">${style(t.cat).i} ${esc(t.cat)} · ${esc(t.p)} · ${esc(t.a)}${t.f?" · "+esc(t.f):""}</div></div>`).join("");
}
function bindView(V){
  const q = $("#q"); if(q){ q.oninput = () => { ST.search = q.value; ST.page = 1; const v = view(), a = filterOps(v); $("#oplist").innerHTML = txList(a.slice(0,60)); }; }
  const fc = $("#fc"); if(fc) fc.onchange = () => { ST.cat = fc.value; ST.page=1; render(); };
  const fd = $("#fd"); if(fd) fd.onchange = () => { ST.dir = fd.value; ST.page=1; render(); };
  const mo = $("#more"); if(mo) mo.onclick = () => { ST.page++; render(); };
  document.querySelectorAll("[data-ok]").forEach(b => b.onclick = ev => { ev.stopPropagation(); const t = D.tx[+b.dataset.ok]; OV.tx[tkey(t)] = t.cat; saveOV(); applyOV(); render(); });
}

/* ───── drill-down ───── */
function sel(V, d){
  return V.tx.filter(t => (d.cls ? (d.cls==="income" ? (t.cls==="income"||t.cls==="loan_in") : t.cls===d.cls) : t.cls!=="internal")
    && (!d.cat || t.cat===d.cat) && (!d.m || t.m===d.m) && (!d.month || t.d.startsWith(d.month))
    && !(ST.life && t.cls==="expense" && !d.cat && !isLifeExp(t)));
}
function drill(d, noPush){
  if(!noPush) STACK.push(d);
  const V = view(), arr = sel(V, d), exp = arr.filter(t=>t.cls==="expense"), inc = arr.filter(t=>t.cls==="income"||t.cls==="loan_in");
  const n = V.ms.length||1, sg = !d.month && n>1;
  let h = `<div class="top"><div><h2>${esc(d.title||"Операции")}</h2><div class="small mut">${d.month?(d.title&&d.title.includes(mFull(d.month))?"":mFull(d.month)):`${mFull(ST.from)} — ${mFull(ST.to)}`}${ST.who!=="all"?" · "+esc(ST.who):""}</div></div><div class="row">${STACK.length>1?`<button class="chip" onclick="drillBack()">← Назад</button>`:""}<button class="chip" onclick="closeDrill()">✕</button></div></div>`;
  h += `<div class="kp">${exp.length?`<div><span class="lbl">Расходы</span><b class="out">${fmt(sum(exp))} ₸</b></div>`:""}${inc.length?`<div><span class="lbl">Приходы</span><b class="in">${fmt(sum(inc))} ₸</b></div>`:""}${sg&&(exp.length||inc.length)?`<div><span class="lbl">В среднем в месяц</span><b>${fmt((exp.length?sum(exp):sum(inc))/n)} ₸</b></div>`:""}<div><span class="lbl">Операций</span><b>${arr.length}</b></div></div>`;
  if(d.month && !d.cat && !d.m && !d.cls){
    const an = anomalies(V), a = an.out.get(d.month), others = V.ms.filter(m => m!==d.month);
    const cm = by(exp, t => t.cat), lines = [];
    if(others.length){ const base = new Map(); V.exp.filter(t => t.d.slice(0,7)!==d.month).forEach(t => base.set(t.cat,(base.get(t.cat)||0)+t.amt));
      sortDesc(new Map([...cm].map(([c,v]) => [c, v-(base.get(c)||0)/others.length]))).filter(x=>x[1]>20000).slice(0,4).forEach(([c,dl]) => lines.push(`${style(c).i} <b>${esc(c)}</b>: ${fmt(cm.get(c))} ₸ — на ${fmt(dl)} ₸ больше обычного`)); }
    const topx = exp.slice().sort((x,y)=>y.amt-x.amt).slice(0,3).map(t => `${esc(t.m)} — ${fmt(t.amt)} ₸`);
    h += `<div class="why-box"><b>${a?`⚠ Расходы выше обычного на ${a.pct}%`:"Что в этом месяце"}</b> (обычно ~${short(an.med)} ₸)<ul style="margin:6px 0 0;padding-left:18px">${lines.map(l=>`<li>${l}</li>`).join("")}${topx.length?`<li>Крупнейшие траты: ${topx.join("; ")}</li>`:""}</ul></div>`;
  }
  if(sg){ const per = by(arr, t => t.d.slice(0,7)), mx = Math.max(1,...per.values()), col = exp.length>=inc.length?"var(--out)":"var(--in)", W = Math.max(300, V.ms.length*44+10);
    const bars = V.ms.map((m,i) => { const v = per.get(m)||0, hh = v/mx*100; return `<g data-d='${J({...d,month:m,title:d.title+" · "+mLabel(m)})}' style="cursor:pointer"><rect x="${i*44+4}" y="0" width="40" height="150" fill="transparent"/><rect x="${i*44+8}" y="${128-hh}" width="30" height="${hh}" rx="5" fill="${col}"/><text x="${i*44+23}" y="144" font-size="11" text-anchor="middle" fill="var(--mut)">${MN[+m.slice(5)-1]}</text>${v?`<text x="${i*44+23}" y="${123-hh}" font-size="10" text-anchor="middle" fill="var(--mut)">${short(v)}</text>`:""}</g>`; }).join("");
    h += `<div class="card"><h2>По месяцам</h2><div class="scroll"><svg width="${W}" height="150">${bars}</svg></div></div>`; }
  const cats = (a, cls, title) => a.length && !d.cat ? `<div class="card"><h2>${title}</h2>${catRows(a, cls, 12, V, !!d.month)}</div>` : "";
  h += cats(exp,"expense","Расходы по категориям") + cats(inc,"income","Приходы по категориям");
  if(!d.m && (d.cat || d.cls)){ const base = d.cls==="income"?inc:exp, m = sortDesc(by(base, t=>t.m)).slice(0,12), c = new Map(); base.forEach(t => c.set(t.m,(c.get(t.m)||0)+1));
    if(m.length>1) h += `<div class="card"><h2>${d.cls==="income"?"От кого / откуда":"Где и кому"}</h2><table>${m.map(([k,v]) => `<tr data-d='${J({...d,m:k,title:k})}' style="cursor:pointer"><td class="tl" style="position:static">${esc(k)}</td><td>${c.get(k)} оп.</td><td><b>${fmt(v)} ₸</b></td></tr>`).join("")}</table></div>`; }
  const lim = d.lim || 40, list = arr.slice().sort((x,y) => y.amt-x.amt);
  h += `<div class="card"><h2>Операции <span class="small mut">(крупные сверху · нажмите, чтобы изменить категорию)</span></h2>${txList(list.slice(0,lim))}${list.length>lim?`<button class="chip" onclick="STACK[STACK.length-1].lim=${lim+60};drill(STACK[STACK.length-1],true)">Показать ещё</button>`:""}</div>`;
  const sh = $("#sheet"), top = sh.scrollTop; sh.innerHTML = h; $("#modal").classList.add("on"); sh.scrollTop = noPush ? top : 0;
}
function drillBack(){ STACK.pop(); drill(STACK[STACK.length-1], true); }
function closeDrill(){ STACK = []; $("#modal").classList.remove("on"); }

/* ───── редактор операции ───── */
function catOptions(dir, cur){
  const exp = [...D.groups.life, ...D.groups.money.filter(c => c!=="Комиссии банка" || true)];
  const custom = [...new Set([...Object.values(OV.tx), ...Object.values(OV.merchant)])].filter(c => !D.categories[c]);
  const g = (label, list) => `<optgroup label="${label}">${[...new Set(list)].map(c => `<option ${c===cur?"selected":""}>${esc(c)}</option>`).join("")}</optgroup>`;
  return dir==="in" ? g("Приходы", INCC) + g("Не считать", [...D.kinds.internal, ...D.kinds.loan]) + (custom.length?g("Мои категории",custom):"") + g("Возврат покупки", exp)
                    : g("Расходы", exp) + g("Не считать", D.kinds.internal) + (custom.length?g("Мои категории",custom):"");
}
function openEdit(t){
  const same = D.tx.filter(x => x.m===t.m && x.dir===t.dir).length;
  $("#edsheet").innerHTML = `<div class="top"><h2>Изменить категорию</h2><button class="chip" onclick="$('#ed').classList.remove('on')">✕</button></div>
   <div class="card"><b>${esc(t.m)}</b><div class="${t.dir==="in"?"in":"out"}" style="font-size:24px;font-weight:800">${t.dir==="in"?"+":"−"}${fmt(t.amt)} ₸</div>
   <div class="small mut">${t.d.split("-").reverse().join(".")} · ${esc(t.p)} · ${esc(t.a)}${t.f?" · "+esc(t.f):""}<br>Сейчас: ${style(t.cat).i} ${esc(t.cat)}${t.cls==="internal"?" (не учитывается)":""}</div>
   <label class="f">Выберите категорию</label><select id="ecat" style="width:100%">${catOptions(t.dir,t.cat)}<option value="__new">➕ Новая категория…</option></select>
   <input type="text" id="enew" placeholder="Название новой категории" style="width:100%;margin-top:8px;display:none">
   <label class="f" style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" id="eall" ${same>1?"":"disabled"}> ${same>1?`Для всех ${same} операций «${esc(t.m)}» (${t.dir==="in"?"приходы":"расходы"})`:"Единственная операция с таким названием"}</label>
   <div class="row" style="margin-top:16px"><button class="main" style="flex:1" id="esave">Сохранить</button>${t.lov?`<button class="sec" id="ereset">Сбросить</button>`:""}</div></div>`;
  $("#ecat").onchange = e => { $("#enew").style.display = e.target.value==="__new" ? "block" : "none"; };
  $("#esave").onclick = () => { let c = $("#ecat").value; if(c==="__new") c = $("#enew").value.trim(); if(!c) return;
    if($("#eall").checked) OV.merchant[t.m+"|"+t.dir] = c; else OV.tx[tkey(t)] = c;
    saveOV(); applyOV(); $("#ed").classList.remove("on"); afterEdit(); };
  const rs = $("#ereset"); if(rs) rs.onclick = () => { delete OV.tx[tkey(t)]; delete OV.merchant[t.m+"|"+t.dir]; saveOV(); applyOV(); $("#ed").classList.remove("on"); afterEdit(); };
  $("#ed").classList.add("on");
}
function afterEdit(){ render(); if(STACK.length) drill(STACK[STACK.length-1], true); }
function copyOV(){
  const txt = JSON.stringify(OV, null, 1);
  (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => alert("Скопировано. Вставьте в чат с Claude."), () => prompt("Скопируйте и отправьте Claude:", txt));
}
boot();
</script>
