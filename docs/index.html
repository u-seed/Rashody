<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Семейные финансы</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💰</text></svg>">
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e5e7eb;--acc:#4f46e5;--in:#16a34a;--out:#e11d48;--chip:#eef0f4;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(15,23,42,.05)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1020;--card:#141a2e;--ink:#e8ecf5;--mut:#8b96b1;--line:#232b45;--acc:#818cf8;--in:#4ade80;--out:#fb7185;--chip:#1c2440;--shadow:none}}
:root[data-theme=dark]{--bg:#0b1020;--card:#141a2e;--ink:#e8ecf5;--mut:#8b96b1;--line:#232b45;--acc:#818cf8;--in:#4ade80;--out:#fb7185;--chip:#1c2440;--shadow:none}
*{box-sizing:border-box}html,body{max-width:100%;overflow-x:hidden}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:1100px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:0}h2{font-size:16px;margin:0 0 10px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.mut{color:var(--mut)}.small{font-size:12px}
.card{background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:0;background:var(--chip);color:var(--ink);padding:7px 12px;border-radius:999px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--acc);color:#fff}
select,input[type=search],input[type=password]{font:inherit;font-size:14px;background:var(--chip);color:var(--ink);border:1px solid transparent;border-radius:10px;padding:7px 10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
.kpi .l{font-size:12px;color:var(--mut)}.kpi .v{font-size:21px;font-weight:700;margin-top:2px;white-space:nowrap}.kpi .s{font-size:12px;color:var(--mut)}
.in{color:var(--in)}.out{color:var(--out)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{flex:none}
.grid2>*,.card,.kpi{min-width:0}.grid2{display:grid;grid-template-columns:1fr;gap:12px}@media(min-width:860px){.grid2{grid-template-columns:1fr 1fr}}
.catrow{display:grid;grid-template-columns:28px 1fr auto;gap:2px 10px;align-items:center;padding:8px 4px;border-radius:10px;cursor:pointer}
.catrow:hover{background:var(--chip)}
.catrow .ic{font-size:20px;grid-row:span 2;text-align:center}
.catrow .nm{font-weight:600}.catrow .am{font-weight:700;text-align:right;white-space:nowrap}
.bar{height:7px;border-radius:5px;background:var(--chip);overflow:hidden;grid-column:2}.bar i{display:block;height:100%;border-radius:5px}
.catrow .sub{grid-column:3;text-align:right;font-size:12px;color:var(--mut);white-space:nowrap}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
td.tl,th.tl{text-align:left;white-space:normal}
.heat{border-radius:6px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;margin-top:8px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
.ins{display:grid;gap:8px}.ins div{background:var(--chip);border-radius:12px;padding:10px 12px}
.modal{position:fixed;inset:0;background:rgba(2,6,23,.55);display:none;align-items:flex-end;justify-content:center;z-index:9}
.modal.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom))}
@media(min-width:860px){.modal{align-items:center}.sheet{border-radius:20px}}
.tx{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:center}
.tx .d{font-size:12px;color:var(--mut)}.tx .a{font-weight:700;white-space:nowrap}.tx .c{font-size:12px;color:var(--mut);grid-column:2/4}
#lock{max-width:360px;margin:14vh auto;text-align:center}
#lock input{width:100%;margin:10px 0}
button.main{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:600;width:100%;cursor:pointer}
.err{color:var(--out);min-height:20px;font-size:13px}
.note{font-size:12px;color:var(--mut);margin:4px 2px 12px}
</style>
</head>
<body>
<div class="wrap">
 <div id="lock" class="card" style="display:none">
  <div style="font-size:42px">🔒</div><h2>Семейные финансы</h2>
  <div class="mut small">Данные зашифрованы, пароль знаете только вы</div>
  <input id="pw" type="password" placeholder="Пароль" autocomplete="current-password">
  <label class="small mut"><input type="checkbox" id="rem" checked> запомнить на этом устройстве</label>
  <div class="err" id="err"></div>
  <button class="main" id="go">Открыть</button>
 </div>
 <div id="app" style="display:none">
  <div class="top"><div><h1>💰 Семейные финансы</h1><div class="mut small" id="sub"></div></div>
   <button class="chip" id="theme" title="Тема">🌓</button></div>
  <div class="card">
   <div class="row" id="periodChips"></div>
   <div class="row" style="margin-top:8px">
    <select id="from"></select><span class="mut">→</span><select id="to"></select>
    <select id="who"></select>
    <button class="chip" id="lifeBtn" title="Только покупки: без переводов людям, наличных и кредитов">Только быт</button>
   </div>
  </div>
  <div class="kpis" id="kpis"></div>
  <div class="tabs" id="tabs"></div>
  <div id="view"></div>
  <div class="note" id="foot"></div>
 </div>
</div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const MN = ["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"];
const fmt = n => Math.round(n).toLocaleString("ru-RU").replace(/\u00a0/g," ");
const short = n => { const a=Math.abs(n); return a>=1e6 ? (n/1e6).toFixed(a>=1e7?0:1).replace(".",",")+" млн" : a>=1e3 ? Math.round(n/1e3)+" тыс" : Math.round(n)+""; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mLabel = m => MN[+m.slice(5)-1] + " " + m.slice(2,4);
let D, ST = {from:"", to:"", who:"all", life:false, tab:"over", search:"", cat:"", dir:"all", page:1};

/* ───── загрузка и расшифровка ───── */
async function decrypt(blob, pw){
  const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2",salt:b(blob.salt),iterations:blob.iter,hash:"SHA-256"}, km, {name:"AES-GCM",length:256}, false, ["decrypt"]);
  const buf = await crypto.subtle.decrypt({name:"AES-GCM",iv:b(blob.iv)}, key, b(blob.ct));
  const txt = await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  return JSON.parse(txt);
}
async function boot(){
  let blob=null, plain=null;
  try { const r = await fetch("data.enc.json",{cache:"no-store"}); if(r.ok) blob = await r.json(); } catch(e){}
  if(!blob){ try { const r = await fetch("data.json",{cache:"no-store"}); if(r.ok) plain = await r.json(); } catch(e){} }
  if(plain){ start(plain); return; }
  if(!blob){ $("#lock").style.display="block"; $("#lock").innerHTML="<h2>Нет данных</h2><div class='mut'>Запустите <code>python scripts/build.py</code> и загрузите docs/data.enc.json</div>"; return; }
  $("#lock").style.display="block";
  const attempt = async pw => { try { start(await decrypt(blob, pw)); if($("#rem").checked) localStorage.setItem("ff_pw", pw); return true; } catch(e){ return false; } };
  const saved = localStorage.getItem("ff_pw"); if(saved && await attempt(saved)) return;
  const go = async () => { $("#err").textContent=""; $("#go").textContent="Расшифровываю…"; const ok = await attempt($("#pw").value); $("#go").textContent="Открыть"; if(!ok) $("#err").textContent="Неверный пароль"; };
  $("#go").onclick = go; $("#pw").onkeydown = e => { if(e.key==="Enter") go(); };
}

/* ───── старт ───── */
function start(data){
  D = data; $("#lock").style.display="none"; $("#app").style.display="block";
  D.months = [...new Set(D.tx.map(t => t.d.slice(0,7)))].sort();
  const last = D.months[D.months.length-1];
  // последний месяц может быть неполным — по умолчанию показываем 12 мес. до него включительно
  ST.to = last; ST.from = D.months[Math.max(0, D.months.length-12)];
  const opts = D.months.map(m => `<option value="${m}">${mLabel(m)}</option>`).join("");
  $("#from").innerHTML = opts; $("#to").innerHTML = opts;
  $("#who").innerHTML = `<option value="all">Вся семья</option>` + D.people.map(p => `<option>${esc(p)}</option>`).join("");
  $("#periodChips").innerHTML = [["3 мес",3],["6 мес",6],["12 мес",12],["Всё время",999]].map(([l,n]) => `<button class="chip" data-n="${n}">${l}</button>`).join("");
  $("#periodChips").onclick = e => { const n = e.target.dataset.n; if(!n) return; ST.to = last; ST.from = D.months[Math.max(0, D.months.length-n)]; sync(); render(); };
  $("#from").onchange = e => { ST.from = e.target.value; if(ST.from>ST.to) ST.to=ST.from; sync(); render(); };
  $("#to").onchange = e => { ST.to = e.target.value; if(ST.from>ST.to) ST.from=ST.to; sync(); render(); };
  $("#who").onchange = e => { ST.who = e.target.value; render(); };
  $("#lifeBtn").onclick = () => { ST.life = !ST.life; render(); };
  const tabs = [["over","Обзор"],["cat","Категории"],["mon","По месяцам"],["peo","Люди и переводы"],["ops","Операции"]];
  $("#tabs").innerHTML = tabs.map(([k,l]) => `<button class="chip tab" data-k="${k}">${l}</button>`).join("");
  $("#tabs").onclick = e => { const k = e.target.dataset.k; if(k){ ST.tab = k; ST.page=1; render(); } };
  $("#theme").onclick = () => { const r = document.documentElement; const dark = getComputedStyle(r).getPropertyValue("--bg").trim()==="#0b1020"; r.dataset.theme = dark ? "light" : "dark"; render(); };
  $("#modal").onclick = e => { if(e.target.id==="modal") $("#modal").classList.remove("on"); };
  $("#sub").textContent = `данные: ${D.tx[0] ? D.tx[0].d : ""} — ${D.tx[D.tx.length-1].d} · обновлено ${D.generated}`;
  sync(); render();
}
function sync(){ $("#from").value = ST.from; $("#to").value = ST.to; }

/* ───── вычисления ───── */
const LIFE = () => new Set(D.groups.life);
function monthsIn(from,to){ return D.months.filter(m => m>=from && m<=to); }
function view(){
  const ms = monthsIn(ST.from, ST.to), set = new Set(ms), life = LIFE();
  let tx = D.tx.filter(t => set.has(t.d.slice(0,7)) && (ST.who==="all" || t.p===ST.who));
  const inc = tx.filter(t => t.cls==="income");
  let exp = tx.filter(t => t.cls==="expense");
  if(ST.life) exp = exp.filter(t => life.has(t.cat));
  return {ms, tx, inc, exp, internal: tx.filter(t => t.cls==="internal"), loan: tx.filter(t => t.cls==="loan_in")};
}
const sum = a => a.reduce((s,t) => s+t.amt, 0);
function by(arr, f){ const m = new Map(); for(const t of arr){ const k = f(t); m.set(k, (m.get(k)||0)+t.amt); } return m; }
const sortDesc = m => [...m.entries()].sort((a,b) => b[1]-a[1]);
const style = c => (D.categories[c] || {c:"#9ca3af", i:"•"});

/* ───── отрисовка ───── */
function render(){
  const V = view(), n = V.ms.length || 1;
  document.querySelectorAll("#periodChips .chip").forEach(b => b.classList.toggle("on", monthsIn(ST.from,ST.to).length === Math.min(+b.dataset.n, D.months.length) && ST.to===D.months[D.months.length-1]));
  $("#lifeBtn").classList.toggle("on", ST.life);
  document.querySelectorAll("#tabs .chip").forEach(b => b.classList.toggle("on", b.dataset.k===ST.tab));
  const I = sum(V.inc), E = sum(V.exp);
  $("#kpis").innerHTML = [
    ["Доходы", fmt(I)+" ₸", `≈ ${short(I/n)} ₸ / мес`, "in"],
    [ST.life ? "Траты на быт" : "Расходы", fmt(E)+" ₸", `≈ ${short(E/n)} ₸ / мес`, "out"],
    ["Разница", (I-E>=0?"+":"−")+fmt(Math.abs(I-E))+" ₸", I-E>=0 ? "доходов больше" : "расходов больше", I-E>=0?"in":"out"],
    ["Операций", fmt(V.tx.length), `${n} мес. · без переводов между своими`, ""]
  ].map(([l,v,s,c]) => `<div class="kpi"><div class="l">${l}</div><div class="v ${c}">${v}</div><div class="s">${s}</div></div>`).join("");
  $("#view").innerHTML = ({over:vOver, cat:vCat, mon:vMon, peo:vPeo, ops:vOps})[ST.tab](V);
  bindView(V);
  const hid = sum(V.internal), ln = sum(V.loan);
  $("#foot").innerHTML = `Не считаются ни доходом, ни расходом: переводы между своими счетами и членами семьи, депозиты — <b>${fmt(hid)} ₸</b> (${V.internal.length} оп.)` + (ln ? `; полученные кредиты — ${fmt(ln)} ₸` : "") + `. Платежи по кредитам входят в расходы (категория «Кредиты и долги»).`;
}

function barChart(V){
  const ms = V.ms, I = by(V.inc, t => t.d.slice(0,7)), E = by(V.exp, t => t.d.slice(0,7));
  const mx = Math.max(1, ...ms.map(m => Math.max(I.get(m)||0, E.get(m)||0)));
  const W = Math.max(320, ms.length*46), H = 190, pad = 22, bw = 14;
  let g = "";
  ms.forEach((m,i) => { const x = i*46+8, hi = (I.get(m)||0)/mx*(H-pad-18), he = (E.get(m)||0)/mx*(H-pad-18);
    g += `<rect x="${x}" y="${H-pad-hi}" width="${bw}" height="${hi}" rx="3" fill="var(--in)"><title>${mLabel(m)}: доход ${fmt(I.get(m)||0)} ₸</title></rect>`;
    g += `<rect x="${x+bw+2}" y="${H-pad-he}" width="${bw}" height="${he}" rx="3" fill="var(--out)"><title>${mLabel(m)}: расход ${fmt(E.get(m)||0)} ₸</title></rect>`;
    g += `<text x="${x+bw}" y="${H-6}" font-size="10" text-anchor="middle" fill="var(--mut)">${mLabel(m).slice(0,3)}</text>`;
    g += `<text x="${x+bw+1}" y="${H-pad-Math.max(hi,he)-4}" font-size="9" text-anchor="middle" fill="var(--mut)">${short(Math.max(I.get(m)||0,E.get(m)||0))}</text>`; });
  return `<div class="scroll"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${g}</svg></div><div class="legend"><span><i style="background:var(--in)"></i>доходы</span><span><i style="background:var(--out)"></i>расходы</span></div>`;
}
function stacked(V){
  const ms = V.ms, cats = sortDesc(by(V.exp, t => t.cat)).map(x => x[0]).slice(0,9);
  const data = ms.map(m => { const r = {}; let other = 0; V.exp.filter(t => t.d.startsWith(m)).forEach(t => { if(cats.includes(t.cat)) r[t.cat]=(r[t.cat]||0)+t.amt; else other+=t.amt; }); r["Остальное"]=other; return r; });
  const all = [...cats, "Остальное"], mx = Math.max(1, ...data.map(r => all.reduce((s,c)=>s+(r[c]||0),0)));
  const W = Math.max(320, ms.length*46), H = 210, pad = 22;
  let g = "";
  data.forEach((r,i) => { let y = H-pad; const x = i*46+8; all.forEach(c => { const h = (r[c]||0)/mx*(H-pad-16); if(h<=0) return; y -= h; g += `<rect x="${x}" y="${y}" width="30" height="${h}" fill="${c==="Остальное"?"#94a3b8":style(c).c}"><title>${mLabel(ms[i])} · ${c}: ${fmt(r[c])} ₸</title></rect>`; });
    g += `<text x="${x+15}" y="${H-6}" font-size="10" text-anchor="middle" fill="var(--mut)">${mLabel(ms[i]).slice(0,3)}</text><text x="${x+15}" y="${y-4}" font-size="9" text-anchor="middle" fill="var(--mut)">${short(all.reduce((s,c)=>s+(r[c]||0),0))}</text>`; });
  return `<div class="scroll"><svg width="${W}" height="${H}">${g}</svg></div><div class="legend">${all.map(c => `<span><i style="background:${c==="Остальное"?"#94a3b8":style(c).c}"></i>${c}</span>`).join("")}</div>`;
}
function catList(V, limit){
  const m = by(V.exp, t => t.cat), tot = sum(V.exp) || 1, n = V.ms.length || 1, rows = sortDesc(m).slice(0, limit||99), mx = rows[0] ? rows[0][1] : 1;
  return rows.map(([c,v]) => { const s = style(c); return `<div class="catrow" data-cat="${esc(c)}"><div class="ic">${s.i}</div><div class="nm">${esc(c)}</div><div class="am">${fmt(v)} ₸</div><div class="bar"><i style="width:${v/mx*100}%;background:${s.c}"></i></div><div class="sub">${(v/tot*100).toFixed(0)}% · ${short(v/n)}/мес</div></div>`; }).join("") || `<div class="mut">Нет данных за период</div>`;
}
function insights(V){
  const n = V.ms.length || 1, life = LIFE(), L = V.exp.filter(t => life.has(t.cat)), out = [];
  const cm = by(L, t => t.cat), tl = sum(L) || 1;
  const food = (cm.get("Продукты")||0), cafe = (cm.get("Кафе и рестораны")||0);
  if(food) out.push(`🛒 На продукты уходит в среднем <b>${fmt(food/n)} ₸ в месяц</b> (${(food/tl*100).toFixed(0)}% бытовых трат). Ещё <b>${fmt(cafe/n)} ₸</b> — кафе и фастфуд.`);
  const mm = sortDesc(by(V.exp, t => t.d.slice(0,7)));
  if(mm.length>1) out.push(`📈 Самый затратный месяц — <b>${mLabel(mm[0][0])}</b> (${fmt(mm[0][1])} ₸), самый экономный — <b>${mLabel(mm[mm.length-1][0])}</b> (${fmt(mm[mm.length-1][1])} ₸).`);
  const mon = by(V.exp, t => t.cat), tr = mon.get("Переводы людям")||0, cash = mon.get("Снятие наличных")||0, cr = mon.get("Кредиты и долги")||0, te = sum(V.exp)||1;
  if(!ST.life) out.push(`🔀 Из всех расходов: переводы людям <b>${(tr/te*100).toFixed(0)}%</b>, наличные <b>${(cash/te*100).toFixed(0)}%</b>, кредиты <b>${(cr/te*100).toFixed(0)}%</b>. На собственно покупки приходится <b>${(tl/te*100).toFixed(0)}%</b> (${fmt(tl/n)} ₸/мес).`);
  const mer = sortDesc(by(L, t => t.m)).slice(0,1)[0]; if(mer) out.push(`🏪 Больше всего потрачено в «${esc(mer[0])}» — ${fmt(mer[1])} ₸.`);
  const sm = L.filter(t => t.amt<=1500); if(sm.length) out.push(`🪙 Мелких покупок (до 1 500 ₸): <b>${sm.length}</b> шт. на ${fmt(sum(sm))} ₸ — в среднем ${(sm.length/n).toFixed(0)} в месяц.`);
  const unk = sum(L.filter(t => t.cat==="Прочие покупки")); if(unk/tl>0.08) out.push(`❓ ${(unk/tl*100).toFixed(0)}% бытовых трат не распознаны («Прочие покупки») — добавьте слова в config/categories.json, и раскладка станет точнее.`);
  return out.map(x => `<div>${x}</div>`).join("");
}
function vOver(V){
  return `<div class="grid2"><div class="card"><h2>Доходы и расходы по месяцам</h2>${barChart(V)}</div>
  <div class="card"><h2>На что уходят деньги</h2>${catList(V, 8)}<div class="mut small" style="margin-top:6px">Нажмите на категорию — увидите магазины и операции</div></div></div>
  <div class="card"><h2>Выводы</h2><div class="ins">${insights(V)}</div></div>`;
}
function vCat(V){
  return `<div class="card"><h2>Расходы по категориям</h2>${catList(V)}</div><div class="card"><h2>Структура расходов по месяцам</h2>${stacked(V)}</div>${heat(V)}`;
}
function heat(V){
  const cats = sortDesc(by(V.exp, t => t.cat)).map(x => x[0]), ms = V.ms, cell = new Map();
  V.exp.forEach(t => { const k = t.cat+"|"+t.d.slice(0,7); cell.set(k, (cell.get(k)||0)+t.amt); });
  const head = `<tr><th>Категория</th>${ms.map(m => `<th>${mLabel(m)}</th>`).join("")}<th>Среднее</th></tr>`;
  const body = cats.map(c => { const vals = ms.map(m => cell.get(c+"|"+m)||0), mx = Math.max(...vals,1), tot = vals.reduce((a,b)=>a+b,0);
    return `<tr><td>${style(c).i} ${esc(c)}</td>${vals.map(v => `<td><span class="heat" style="display:block;padding:2px 6px;background:${v?hexA(style(c).c, .12+.55*v/mx):"transparent"}">${v?short(v):""}</span></td>`).join("")}<td><b>${short(tot/(ms.length||1))}</b></td></tr>`; }).join("");
  return `<div class="card"><h2>Тепловая карта: категория × месяц</h2><div class="scroll"><table>${head}${body}</table></div></div>`;
}
const hexA = (h,a) => { const n = parseInt(h.slice(1),16); return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`; };
function vMon(V){
  const I = by(V.inc, t => t.d.slice(0,7)), E = by(V.exp, t => t.d.slice(0,7)), N = by(V.tx.filter(t=>t.cls==="expense"), t=>t.d.slice(0,7));
  const rows = V.ms.slice().reverse().map(m => { const i = I.get(m)||0, e = E.get(m)||0; return `<tr><td>${mLabel(m)}</td><td class="in">${fmt(i)}</td><td class="out">${fmt(e)}</td><td class="${i-e>=0?"in":"out"}">${i-e>=0?"+":"−"}${fmt(Math.abs(i-e))}</td></tr>`; }).join("");
  return `<div class="card"><h2>Доходы и расходы</h2>${barChart(V)}</div><div class="card"><h2>Таблица по месяцам</h2><div class="scroll"><table><tr><th>Месяц</th><th>Доходы</th><th>Расходы</th><th>Разница</th></tr>${rows}</table></div></div>
  <div class="card"><h2>Откуда доходы</h2>${(()=>{ const m = sortDesc(by(V.inc, t=>t.cat)), tot = sum(V.inc)||1; return m.map(([c,v]) => `<div class="catrow" style="cursor:default"><div class="ic">${style(c).i}</div><div class="nm">${esc(c)}</div><div class="am">${fmt(v)} ₸</div><div class="bar"><i style="width:${v/tot*100}%;background:${style(c).c}"></i></div><div class="sub">${(v/tot*100).toFixed(0)}%</div></div>`).join(""); })()}</div>`;
}
function vPeo(V){
  const list = (arr, label) => { const m = sortDesc(by(arr, t => t.m)).slice(0,15), c = new Map(); arr.forEach(t => c.set(t.m,(c.get(t.m)||0)+1));
    return `<div class="card"><h2>${label}</h2><table>${m.map(([k,v]) => `<tr><td class="tl" style="position:static">${esc(k)}</td><td>${c.get(k)} оп.</td><td><b>${fmt(v)} ₸</b></td></tr>`).join("") || "<tr><td>—</td></tr>"}</table></div>`; };
  const to = V.exp.filter(t => t.cat==="Переводы людям"), from = V.inc.filter(t => t.cat==="Переводы от людей"), cash = V.exp.filter(t => t.cat==="Снятие наличных");
  return `<div class="grid2">${list(to,"Кому больше всего переводите")}${list(from,"От кого больше всего получаете")}</div>
  <div class="note">В Halyk получатель перевода на карту в выписке не указан — такие переводы собраны в одну строку «Перевод на карту». В Kaspi видно имя.</div>
  <div class="grid2">${list(V.exp.filter(t=>t.cat==="Кредиты и долги"),"Кредиты и долги")}${list(cash,"Снятие наличных")}</div>`;
}
function vOps(V){
  const cats = [...new Set(V.tx.map(t => t.cat))].sort();
  let a = V.tx.filter(t => t.cls!=="internal" || ST.cat==="__int");
  if(ST.cat && ST.cat!=="__int") a = a.filter(t => t.cat===ST.cat);
  if(ST.cat==="__int") a = V.tx.filter(t => t.cls==="internal");
  if(ST.dir!=="all") a = a.filter(t => t.dir===ST.dir);
  const q = ST.search.toLowerCase(); if(q) a = a.filter(t => (t.m+" "+t.cat+" "+t.d+" "+t.amt).toLowerCase().includes(q));
  a = a.slice().sort((x,y) => y.d.localeCompare(x.d) || y.amt-x.amt);
  const shown = a.slice(0, ST.page*60);
  return `<div class="card"><div class="row"><input type="search" id="q" placeholder="Поиск: магазин, сумма, дата…" value="${esc(ST.search)}" style="flex:1;min-width:160px">
   <select id="fc"><option value="">Все категории</option>${cats.map(c => `<option ${ST.cat===c?"selected":""}>${esc(c)}</option>`).join("")}<option value="__int" ${ST.cat==="__int"?"selected":""}>↔ Между своими</option></select>
   <select id="fd"><option value="all">Все</option><option value="in" ${ST.dir==="in"?"selected":""}>Приход</option><option value="out" ${ST.dir==="out"?"selected":""}>Расход</option></select></div>
   <div class="mut small" style="margin:8px 0">Найдено: ${a.length} · на сумму ${fmt(sum(a))} ₸</div>${txList(shown)}
   ${a.length>shown.length ? `<button class="chip" id="more" style="margin-top:10px">Показать ещё</button>` : ""}</div>`;
}
function txList(a){
  return a.map(t => `<div class="tx"><div class="d">${t.d.slice(8)}.${t.d.slice(5,7)}.${t.d.slice(2,4)}</div><div>${esc(t.m)}</div><div class="a ${t.dir==="in"?"in":"out"}">${t.dir==="in"?"+":"−"}${fmt(t.amt)} ₸</div><div class="c">${style(t.cat).i} ${esc(t.cat)} · ${esc(t.p)} · ${esc(t.a)}${t.f?" · "+esc(t.f):""}</div></div>`).join("");
}
function bindView(V){
  document.querySelectorAll(".catrow[data-cat]").forEach(r => r.onclick = () => openCat(V, r.dataset.cat));
  const q = $("#q"); if(q){ q.oninput = () => { ST.search = q.value; ST.page = 1; const pos = q.selectionStart; $("#view").innerHTML = vOps(view()); const q2 = $("#q"); q2.focus(); q2.setSelectionRange(pos,pos); bindView(view()); }; }
  const fc = $("#fc"); if(fc) fc.onchange = () => { ST.cat = fc.value; ST.page=1; render(); };
  const fd = $("#fd"); if(fd) fd.onchange = () => { ST.dir = fd.value; ST.page=1; render(); };
  const mo = $("#more"); if(mo) mo.onclick = () => { ST.page++; render(); };
}
function openCat(V, c){
  const arr = V.exp.filter(t => t.cat===c), s = style(c), n = V.ms.length||1;
  const mer = sortDesc(by(arr, t => t.m)).slice(0,12), cnt = new Map(); arr.forEach(t => cnt.set(t.m,(cnt.get(t.m)||0)+1));
  const per = by(arr, t => t.d.slice(0,7)), mx = Math.max(1, ...V.ms.map(m => per.get(m)||0));
  const W = Math.max(300, V.ms.length*40);
  const bars = V.ms.map((m,i) => { const h = (per.get(m)||0)/mx*90; return `<rect x="${i*40+6}" y="${110-h}" width="28" height="${h}" rx="4" fill="${s.c}"><title>${mLabel(m)}: ${fmt(per.get(m)||0)} ₸</title></rect><text x="${i*40+20}" y="124" font-size="10" text-anchor="middle" fill="var(--mut)">${mLabel(m).slice(0,3)}</text>${per.get(m)?`<text x="${i*40+20}" y="${106-h}" font-size="9" text-anchor="middle" fill="var(--mut)">${short(per.get(m))}</text>`:""}`; }).join("");
  $("#sheet").innerHTML = `<div class="top"><h2 style="margin:0">${s.i} ${esc(c)}</h2><button class="chip" onclick="document.getElementById('modal').classList.remove('on')">Закрыть</button></div>
   <div class="kpis"><div class="kpi"><div class="l">Всего</div><div class="v out">${fmt(sum(arr))} ₸</div></div><div class="kpi"><div class="l">В среднем в месяц</div><div class="v">${fmt(sum(arr)/n)} ₸</div></div><div class="kpi"><div class="l">Операций</div><div class="v">${arr.length}</div><div class="s">средний чек ${fmt(sum(arr)/(arr.length||1))} ₸</div></div></div>
   <div class="card"><h2>По месяцам</h2><div class="scroll"><svg width="${W}" height="132">${bars}</svg></div></div>
   <div class="card"><h2>Где тратите</h2><table>${mer.map(([k,v]) => `<tr><td class="tl" style="position:static">${esc(k)}</td><td>${cnt.get(k)} оп.</td><td><b>${fmt(v)} ₸</b></td></tr>`).join("")}</table></div>
   <div class="card"><h2>Последние операции</h2>${txList(arr.slice().sort((a,b)=>b.d.localeCompare(a.d)).slice(0,40))}</div>`;
  $("#modal").classList.add("on");
}
boot();
</script>
</body>
</html>
